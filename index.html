<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Recipes & Grocery List</title>
<meta name="theme-color" content="#156534" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== Login screen ===== -->
<div id="login-screen" class="screen hidden">
  <div class="login-card">
    <h1>🍽️ Family Recipes</h1>
    <p class="muted">Sign in to view and edit your shared recipes and grocery list.</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="btn primary full">Sign In</button>
    </form>
    <p id="login-error" class="error hidden"></p>
  </div>
</div>

<!-- ===== App shell ===== -->
<div id="app" class="screen hidden">
  <header id="app-header">
    <div class="header-left">
      <button id="back-btn" class="icon-btn hidden" title="Back">←</button>
      <h1 id="header-title">Recipes</h1>
    </div>
    <button id="signout-btn" class="icon-btn" title="Sign out">⎋</button>
  </header>

  <main id="content"></main>

  <nav id="nav">
    <button class="nav-btn active" data-tab="recipes">
      <span class="nav-icon">📖</span><span>Recipes</span>
    </button>
    <button class="nav-btn" data-tab="grocery">
      <span class="nav-icon">🛒</span><span>Grocery List</span>
      <span id="grocery-badge" class="badge hidden">0</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Modal host -->
<div id="modal-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
